<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>WebAR: маска на лицо</title>

  <!-- A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>

  <!-- MindAR face-tracking -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>

  <style>
    /* Жёстко фиксируем размеры — важно для Android */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .ui {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      color: #fff; font-family: system-ui, sans-serif; font-size: 14px;
      background: rgba(0,0,0,.55); padding: 8px 14px;
      border-radius: 999px; z-index: 10;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 10px;
      background: rgba(20,40,28,.85); justify-content: center;
      z-index: 100; flex-wrap: wrap;
    }
    nav a {
      padding: 8px 14px; border-radius: 999px;
      color: #eaf5ee; text-decoration: none; font-size: 14px;
      border: 1px solid #2f5c3f;
    }
    nav a.active { background: #4caf50; color: #04140a; font-weight: 600; border-color: #4caf50; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Задание 1</a>
    <a href="marker.html">Задание 2</a>
    <a href="face.html" class="active">Задание 3: Маска</a>
    <a href="hittest.html">Задание 4: Hit-test</a>
  </nav>

  <div class="ui">📷 Наведите камеру на лицо</div>

  <a-scene
    mindar-face="
      autoStart: true;
      uiLoading: no;
      uiError: yes;
      uiScanning: yes;
      filterMinCF: 0.001;
      filterBeta: 0.002;
    "
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <a-asset-item id="glasses-model" src="./models/glasses/scene.gltf"></a-asset-item>
    </a-assets>

    <!-- ВАЖНО: look-controls выключены, чтобы гироскоп не конфликтовал с MindAR -->
    <a-camera position="0 0 0" active="false" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 0.8"></a-entity>
    <a-entity light="type: directional; intensity: 0.7; position: 0 1 1"></a-entity>

    <a-entity mindar-face-target="anchorIndex: 168">
      <a-gltf-model
        src="#glasses-model"
        position="0 -0.1 0"
        rotation="0 0 0"
        scale="0.01 0.01 0.01"
      ></a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
