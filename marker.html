<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WebAR-атлас растений: трекинг</title>

  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .ui {
      position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
      color: #fff; font-family: system-ui, sans-serif; font-size: 14px;
      background: rgba(0,0,0,.55); padding: 8px 14px;
      border-radius: 999px; z-index: 10;
    }
    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 10px;
      background: rgba(20,40,28,.85); justify-content: center; z-index: 100;
    }
    nav a {
      padding: 8px 14px; border-radius: 999px;
      color: #eaf5ee; text-decoration: none; font-size: 14px;
      border: 1px solid #2f5c3f;
    }
    nav a.active { background: #4caf50; color: #04140a; font-weight: 600; border-color: #4caf50; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Задание 1: AR-модель</a>
    <a href="marker.html" class="active">Задание 2: Трекинг</a>
  </nav>

  <div class="ui">📷 Наведите камеру на картинку растения</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <a-assets>
      <a-asset-item id="sunflower-model" src="./models/sunflower/scene.gltf"></a-asset-item>
      <a-asset-item id="fern-model"      src="./models/3d_fern_-_01/scene.gltf"></a-asset-item>
      <a-asset-item id="cactus-model"    src="./models/cactus/scene.gltf"></a-asset-item>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; position: 1 2 1"></a-entity>

    <!-- Маркер 0: подсолнух -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model src="#sunflower-model" scale="0.005 0.005 0.005"></a-gltf-model>
    </a-entity>

    <!-- Маркер 1: папоротник -->
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model src="#fern-model" scale="0.1 0.1 0.1"></a-gltf-model>
    </a-entity>

    <!-- Маркер 2: кактус -->
    <a-entity mindar-image-target="targetIndex: 2">
      <a-gltf-model src="#cactus-model" scale="0.005 0.005 0.005"></a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
