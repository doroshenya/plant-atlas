<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WebAR-атлас: трекинг маркера</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR для A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .ui {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      background: rgba(0,0,0,.55);
      padding: 8px 14px;
      border-radius: 999px;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="ui">📷 Наведите камеру на картинку-маркер</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiLoading: no; uiError: no; uiScanning: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- Ресурсы: модель подсолнуха -->
    <a-assets>
      <a-asset-item id="sunflower-model"
        src="./models/sunflower/scene.gltf"></a-asset-item>
    </a-assets>

    <!-- Камера -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Освещение -->
    <a-entity light="type: ambient; intensity: 0.7"></a-entity>
    <a-entity light="type: directional; intensity: 0.9; position: 1 2 1"></a-entity>

    <!-- Целевой объект (маркер) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Модель, которая появится над маркером -->
      <a-gltf-model
        rotation="0 0 0"
        position="0 0 0"
        scale="0.005 0.005 0.005"
        src="#sunflower-model"
      ></a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
