<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>WebAR: Three.js + Hit-test</title>

  <style>
    body { margin: 0; overflow: hidden; background: #000; color: #fff; font-family: system-ui, sans-serif; }

    nav {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 10px;
      background: rgba(20,40,28,.85); justify-content: center;
      z-index: 100; flex-wrap: wrap;
    }
    nav a {
      padding: 8px 14px; border-radius: 999px;
      color: #eaf5ee; text-decoration: none; font-size: 14px;
      border: 1px solid #2f5c3f;
    }
    nav a.active { background: #4caf50; color: #04140a; font-weight: 600; border-color: #4caf50; }

    #ar-button {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%);
      padding: 14px 28px; border-radius: 999px; border: none;
      background: #4caf50; color: #04140a; font-size: 16px; font-weight: 600;
      z-index: 100; cursor: pointer;
    }
    #info {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.55); padding: 8px 14px;
      border-radius: 999px; font-size: 14px; z-index: 100;
      text-align: center; max-width: 90vw;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Задание 1</a>
    <a href="marker.html">Задание 2</a>
    <a href="face.html">Задание 3</a>
    <a href="hittest.html" class="active">Задание 4: Hit-test</a>
  </nav>

  <div id="info">📱 Наведите на поверхность, коснитесь для размещения</div>

  <button id="ar-button">Запустить AR</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    let camera, scene, renderer;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let reticle;        // маркер-кольцо
    let placed = false; // защита от повторного размещения

    init();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.01,
        20
      );

      // Освещение
      const ambientLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.5);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 2);
      dirLight.position.set(1, 2, 1);
      scene.add(dirLight);

      // Рендерер
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);

      // AR-кнопка
      const arButton = ARButton.createButton(renderer, {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay'],
        domOverlay: { root: document.body }
      });

      // Наш обработчик: клик по кнопке = старт AR
      document.getElementById('ar-button').addEventListener('click', () => {
        arButton.click();
      });

      // Маркер — кольцо на плоскости
      reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
        new THREE.MeshBasicMaterial({ color: 0x4caf50 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      // При тапе — разместить объект
      renderer.xr.addEventListener('sessionstart', () => {
        const session = renderer.xr.getSession();
        session.addEventListener('select', onSelect);
      });

      // Анимация
      renderer.setAnimationLoop(render);
      window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function onSelect() {
      if (!reticle.visible) return;
      if (placed) return;

      // Создаём куб
      const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
      const material = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
      const cube = new THREE.Mesh(geometry, material);

      // Ставим в точку маркера
      cube.position.setFromMatrixPosition(reticle.matrix);
      cube.quaternion.setFromRotationMatrix(reticle.matrix);

      scene.add(cube);

      placed = true;
      document.getElementById('info').textContent = '✅ Объект размещён. Обойдите его — он остаётся на месте.';
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();

        if (!hitTestSourceRequested) {
          session.requestReferenceSpace('viewer').then((viewerSpace) => {
            session.requestHitTestSource({ space: viewerSpace }).then((source) => {
              hitTestSource = source;
            });
          });

          session.addEventListener('end', () => {
            hitTestSourceRequested = false;
            hitTestSource = null;
            placed = false;
            document.getElementById('info').textContent = '📱 Наведите на поверхность, коснитесь для размещения';
          });

          hitTestSourceRequested = true;
        }

        if (hitTestSource) {
          const hitTestResults = frame.getHitTestResults(hitTestSource);

          if (hitTestResults.length > 0) {
            const hit = hitTestResults[0];
            const pose = hit.getPose(referenceSpace);

            reticle.visible = true;
            reticle.matrix.fromArray(pose.transform.matrix);
          } else {
            reticle.visible = false;
          }
        }
      }

      renderer.render(scene, camera);
    }
  </script>

</body>
</html>
